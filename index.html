<!doctype html>
<html lang="tr" data-theme="navy-gold">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Servet — Varlık Takip</title>
<meta name="description" content="Altın, hisse, nakit, kripto ve daha fazlasını; elde, bankada veya platformda tuttuğunuz şekilde takip edin.">
<meta name="theme-color" content="#0b1533">
<link rel="manifest" href="manifest.webmanifest?v=2.4.0">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Servet">
<link rel="stylesheet" href="css/style.css?v=2.4.0">
</head>
<body>

<!-- ================= GİRİŞ ANİMASYONU ================= -->
<div id="splash" class="splash" role="status" aria-label="Yükleniyor">
  <div class="splash-inner">
    <div class="splash-word" aria-label="Servet">
      <span class="ser">S</span><span class="ser">E</span><span class="ser">R</span><span class="vet">V</span><span class="vet">E</span><span class="vet">T</span>
    </div>
    <p class="splash-sub">Varlık &amp; Portföy Yönetimi</p>
    <div class="splash-bar"><i></i></div>
  </div>
</div>

<!-- ================= UYGULAMA ================= -->
<div id="app" class="app" hidden>

  <header class="topbar">
    <button class="icon-btn only-mobile" id="navToggle" aria-label="Menüyü aç" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <a class="brand" href="#/">
      <span class="wordmark" aria-label="Servet"><span class="ser">SER</span><span class="vet">VET</span></span>
    </a>

    <div class="topbar-spacer"></div>

    <div class="topbar-total" id="topbarTotal" title="Toplam portföy değeri"></div>

    <button class="icon-btn" id="refreshBtn" aria-label="Fiyatları yenile" title="Fiyatları ve kurları yenile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
    </button>
    <button class="btn btn-gold" id="addAssetBtn">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="btn-ico"><path d="M12 5v14M5 12h14"/></svg>
      <span class="only-desktop">Varlık Ekle</span>
    </button>
  </header>

  <nav class="sidenav" id="sidenav" aria-label="Ana gezinme">
    <a href="#/" data-route="dashboard" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg><span>Ana Sayfa</span>
    </a>
    <a href="#/assets" data-route="assets" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v12H3zM3 7l3-4h12l3 4M9 12h6"/></svg><span>Varlıklar</span>
    </a>
    <a href="#/stats" data-route="stats" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>İstatistik</span>
    </a>
    <a href="#/history" data-route="history" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l4 2"/></svg><span>Geçmiş</span>
    </a>
    <a href="#/settings" data-route="settings" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a1.7 1.7 0 0 0-1.6-1H1a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 3 8.6a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 3V2a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15.4 3"/></svg><span>Ayarlar</span>
    </a>
    <div class="nav-foot">
      <div class="nav-badge" id="offlineBadge" hidden>Çevrimdışı</div>
      <button class="link-btn" id="installBtn" hidden>Uygulamayı Yükle</button>
      <p class="nav-note">Veriler yalnızca bu cihazda saklanır.</p>
    </div>
  </nav>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="view" tabindex="-1"></main>

  <nav class="tabbar only-mobile" aria-label="Alt gezinme">
    <a href="#/" data-route="dashboard"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg><span>Ana</span></a>
    <a href="#/assets" data-route="assets"><svg viewBox="0 0 24 24"><path d="M3 7h18v12H3zM3 7l3-4h12l3 4"/></svg><span>Varlık</span></a>
    <a href="#/stats" data-route="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>İstatistik</span></a>
    <a href="#/history" data-route="history"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l4 2"/></svg><span>Geçmiş</span></a>
    <a href="#/settings" data-route="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M4 12h2M18 12h2M12 4v2M12 18v2"/></svg><span>Ayarlar</span></a>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root" aria-live="polite" aria-atomic="true"></div>

<script src="js/lock.js?v=2.4.0"></script>
<script src="js/symbols.js?v=2.4.0"></script>
<script src="js/data.js?v=2.4.0"></script>
<script src="js/store.js?v=2.4.0"></script>
<script src="js/charts.js?v=2.4.0"></script>
<script src="js/market.js?v=2.4.0"></script>
<script src="js/qr.js?v=2.4.0"></script>
<script src="js/transfer.js?v=2.4.0"></script>
<script src="js/onboard.js?v=2.4.0"></script>
<script>
/* Şifreli veri varsa uygulama başlamadan önce PIN sorulur. */
(function () {
  if (!window.Lock || !Lock.isEnabled()) return;
  document.documentElement.dataset.locked = '1';
  var splash = document.getElementById('splash');
  if (splash) splash.style.display = 'none';
  window.__servetBootGate = Lock.unlockScreen();
})();
</script>
<script src="js/app.js?v=2.4.0"></script>
</body>
</html>
